name: Medicube Missing Images Native Quality Final
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests pillow rapidfuzz opencv-contrib-python-headless numpy
      - run: curl -L --fail --retry 3 -o tools/FSRCNN_x4.pb https://github.com/Saafke/FSRCNN_Tensorflow/raw/master/models/FSRCNN_x4.pb
      - run: python tools/medicube_cloud_download_fixed.py
      - run: python tools/medicube_replace_lowres.py
      - run: python tools/medicube_fix_two_wrong.py
      - run: python tools/medicube_replace_300px.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medicube-missing-images-native-quality-final
          path: tools/OUTPUT/
          if-no-files-found: error
          retention-days: 3
