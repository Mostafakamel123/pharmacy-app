name: Medicube Missing Images Fixed
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests pillow rapidfuzz
      - run: python tools/medicube_cloud_download_fixed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medicube-missing-images-fixed
          path: tools/OUTPUT/
          if-no-files-found: error
          retention-days: 3
